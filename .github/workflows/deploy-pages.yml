name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download game assets from Worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d assets/bgm ]; then
            echo "=== Downloading game assets from Assets repo release ==="
            TAG="v$(curl -sf https://ba-assets.imlindora.workers.dev/latest/assets_version.json | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")"
            if [ -n "$TAG" ] && [ "$TAG" != "v" ]; then
              for pkg in assets_assets-player intro; do
                gh release download "$TAG" --repo Augus1217/BA-MemorialLobby-Assets \
                  --pattern "assets-${pkg}-*.tar.gz" --clobber -D . 2>/dev/null \
                  && echo "  ✓ $pkg ($TAG)" \
                  || echo "::warning::Failed to download ${pkg} ($TAG)"
              done
              # 解壓所有已下載的 tar.gz
              for f in assets-assets-player-*.tar.gz assets-intro-*.tar.gz; do
                [ -f "$f" ] && tar xzf "$f" -C . && rm -f "$f"
              done
            else
              echo "::warning::Failed to resolve version, build will use any local assets"
            fi
          else
            echo "Assets already present, skipping download"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
