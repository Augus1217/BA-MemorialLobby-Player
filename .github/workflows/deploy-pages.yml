name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download boot assets from Worker
        run: |
          echo "=== Downloading boot assets from Worker ==="
          WORKER_BASE="https://ba-assets.imlindora.workers.dev"
          VER=$(curl -sf "$WORKER_BASE/latest/assets_version.json" | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
          if [ -z "$VER" ]; then
            echo "::warning::Failed to resolve version, build will use any local assets"
            exit 0
          fi
          echo "  version: $VER"
          mkdir -p assets/loading assets/intro assets/ui
          # core pack：只抽 loading/ + ui/ui_i18n.json（~20MB，比全抓 assets-player 423MB 快得多）
          URL_CORE="$WORKER_BASE/v${VER}/assets-core-v${VER}.tar.gz"
          if curl -sf "$URL_CORE" -o /tmp/core.tar.gz; then
            tar xzf /tmp/core.tar.gz -C . --include='assets/loading/*' 'assets/ui/ui_i18n.json' 2>/dev/null
            echo "  ✓ core (v${VER})"
          else
            echo "::warning::Failed to download core pack (v${VER})"
          fi
          rm -f /tmp/core.tar.gz
          # intro pack：只抽 intro/（~5MB）
          URL_INTRO="$WORKER_BASE/v${VER}/assets-intro-v${VER}.tar.gz"
          if curl -sf "$URL_INTRO" -o /tmp/intro.tar.gz; then
            tar xzf /tmp/intro.tar.gz -C . --include='assets/intro/*' 2>/dev/null
            echo "  ✓ intro (v${VER})"
          else
            echo "::warning::Failed to download intro pack (v${VER})"
          fi
          rm -f /tmp/intro.tar.gz
          # 官方 ui 圖（氣泡/游標）不得進 Pages：delete 使其 url() 保持 runtime
          # 解析（SW 由 core pack 提供），避免 vite 打包成 hash 洩漏。
          rm -f assets/ui/Common_Balloon_Type2.png assets/ui/Lobby_balloon.png \
                assets/ui/Lobby_balloon2.png assets/ui/PCIcon_MousePoint.png
          true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
