name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download game assets from Worker
        run: |
          if [ ! -d assets/bgm ]; then
            echo "=== Downloading game assets from Worker ==="
            WORKER_BASE="https://ba-assets.imlindora.workers.dev"
            VER=$(curl -sf "$WORKER_BASE/latest/assets_version.json" | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
            if [ -n "$VER" ]; then
              for pkg in assets-player intro; do
                # tar_pack 檔名格式：assets-<key>-v<ver>.tar.gz（assets- 前綴）
                URL="$WORKER_BASE/v${VER}/assets-${pkg}-v${VER}.tar.gz"
                if curl -sf "$URL" -o /tmp/pkg.tar.gz && tar xzf /tmp/pkg.tar.gz -C .; then
                  echo "  ✓ $pkg (v${VER})"
                else
                  echo "::warning::Failed to download ${pkg} (v${VER}), build will use any local assets"
                fi
                rm -f /tmp/pkg.tar.gz
              done
            else
              echo "::warning::Failed to resolve version, build will use any local assets"
            fi
          else
            echo "Assets already present, skipping download"
          fi
          true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
