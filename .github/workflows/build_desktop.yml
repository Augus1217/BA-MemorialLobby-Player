name: Build & Release Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Release (uncheck = build only)'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    # electron-userland 官方容器：內含能正常產 rpm/deb/AppImage 的 fpm+rpmbuild 工具鏈
    runs-on: ubuntu-latest
    container: electronuserland/builder:20
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Download game assets from Worker
        shell: bash   # 語法是 bash（win runner 預設 pwsh 會直接炸——v0.5.0 首跑實證）
        run: |
          if [ ! -d assets/bgm ]; then
            echo "=== Downloading game assets from Worker ==="
            WORKER_BASE="https://ba-assets.imlindora.workers.dev"
            # python3 在 Windows Git Bash 不保證在 PATH → python 後備
            VER=$(curl -sf "$WORKER_BASE/latest/assets_version.json" | (python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || python -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null) || echo "")
            if [ -n "$VER" ]; then
              for pkg in assets-player intro; do
                # tar_pack 檔名格式：assets-<key>-v<ver>.tar.gz（assets- 前綴）
                URL="$WORKER_BASE/v${VER}/assets-${pkg}-v${VER}.tar.gz"
                if curl -sf "$URL" -o /tmp/pkg.tar.gz && tar xzf /tmp/pkg.tar.gz -C .; then
                  echo "  ✓ $pkg (v${VER})"
                else
                  echo "::warning::Failed to download ${pkg} (v${VER}), build will use any local assets"
                fi
                rm -f /tmp/pkg.tar.gz
              done
            else
              echo "::warning::Failed to resolve version, build will use any local assets"
            fi
          else
            echo "Assets already present, skipping download"
          fi
          true

      - name: Verify bundled assets present
        shell: bash
        # Worker 下載失敗只會 warn 不會 fail——但 FX_TEX 缺席等於「原版重製」在
        # 打包版直接啞掉。release 管線寧可響亮地失敗，也不要靜默出殘包。
        run: |
          set -e
          echo "clickfx textures:"; ls assets/clickfx/FX_TEX_*.png
          echo "loading screen:";   ls assets/loading/title.webm assets/loading/font.otf assets/loading/spinner.png

      - name: Build renderer (Vite)
        run: npx vite build

      # 不帶 --publish：只出包，統一由 release job 上傳（避免三 job race 觸發 secondary rate limit）
      - name: Build Linux packages (AppImage x64+arm64, deb, rpm)
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show artifacts
        run: ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download game assets from Worker
        shell: bash   # 語法是 bash（win runner 預設 pwsh 會直接炸——v0.5.0 首跑實證）
        run: |
          if [ ! -d assets/bgm ]; then
            echo "=== Downloading game assets from Worker ==="
            WORKER_BASE="https://ba-assets.imlindora.workers.dev"
            # python3 在 Windows Git Bash 不保證在 PATH → python 後備
            VER=$(curl -sf "$WORKER_BASE/latest/assets_version.json" | (python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || python -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null) || echo "")
            if [ -n "$VER" ]; then
              for pkg in assets-player intro; do
                # tar_pack 檔名格式：assets-<key>-v<ver>.tar.gz（assets- 前綴）
                URL="$WORKER_BASE/v${VER}/assets-${pkg}-v${VER}.tar.gz"
                if curl -sf "$URL" -o /tmp/pkg.tar.gz && tar xzf /tmp/pkg.tar.gz -C .; then
                  echo "  ✓ $pkg (v${VER})"
                else
                  echo "::warning::Failed to download ${pkg} (v${VER}), build will use any local assets"
                fi
                rm -f /tmp/pkg.tar.gz
              done
            else
              echo "::warning::Failed to resolve version, build will use any local assets"
            fi
          else
            echo "Assets already present, skipping download"
          fi
          true

      - name: Verify bundled assets present
        shell: bash
        # Worker 下載失敗只會 warn 不會 fail——但 FX_TEX 缺席等於「原版重製」在
        # 打包版直接啞掉。release 管線寧可響亮地失敗，也不要靜默出殘包。
        run: |
          set -e
          echo "clickfx textures:"; ls assets/clickfx/FX_TEX_*.png
          echo "loading screen:";   ls assets/loading/title.webm assets/loading/font.otf assets/loading/spinner.png

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Build Windows packages (NSIS + portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download game assets from Worker
        shell: bash   # 語法是 bash（win runner 預設 pwsh 會直接炸——v0.5.0 首跑實證）
        run: |
          if [ ! -d assets/bgm ]; then
            echo "=== Downloading game assets from Worker ==="
            WORKER_BASE="https://ba-assets.imlindora.workers.dev"
            # python3 在 Windows Git Bash 不保證在 PATH → python 後備
            VER=$(curl -sf "$WORKER_BASE/latest/assets_version.json" | (python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || python -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null) || echo "")
            if [ -n "$VER" ]; then
              for pkg in assets-player intro; do
                # tar_pack 檔名格式：assets-<key>-v<ver>.tar.gz（assets- 前綴）
                URL="$WORKER_BASE/v${VER}/assets-${pkg}-v${VER}.tar.gz"
                if curl -sf "$URL" -o /tmp/pkg.tar.gz && tar xzf /tmp/pkg.tar.gz -C .; then
                  echo "  ✓ $pkg (v${VER})"
                else
                  echo "::warning::Failed to download ${pkg} (v${VER}), build will use any local assets"
                fi
                rm -f /tmp/pkg.tar.gz
              done
            else
              echo "::warning::Failed to resolve version, build will use any local assets"
            fi
          else
            echo "Assets already present, skipping download"
          fi
          true

      - name: Verify bundled assets present
        shell: bash
        # Worker 下載失敗只會 warn 不會 fail——但 FX_TEX 缺席等於「原版重製」在
        # 打包版直接啞掉。release 管線寧可響亮地失敗，也不要靜默出殘包。
        run: |
          set -e
          echo "clickfx textures:"; ls assets/clickfx/FX_TEX_*.png
          echo "loading screen:";   ls assets/loading/title.webm assets/loading/font.otf assets/loading/spinner.png

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Build macOS packages (DMG + zip, universal)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 無簽名憑證也能出包；使用者右鍵開啟繞 Gatekeeper

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: [build-linux, build-win, build-mac]
    # build-only 模式（dispatch 且 publish=false）不需跑上傳
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4   # 只為了讀 package.json 的版本號

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show files
        run: ls -lh artifacts/

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch 從分支觸發：GITHUB_REF_NAME 是「main」，
            # 直接拿來當 release tag 會在 repo 建出一個叫 main 的 release。
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # gh CLI 免 checkout 直接指定 repo
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="BA Memorial Lobby ${TAG}"

          gh release create "$TAG" --title "$TITLE" --generate-notes --draft=false || {
            echo "release 已存在，改用既有 release"
          }

          # 逐檔上傳 + 失敗退避重試（GitHub secondary rate limit 防護，同 Assets repo 做法）
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ok=""
            for i in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "uploaded: $base"
                ok=1
                break
              fi
              echo "retry $i for $base"
              sleep $((i * 10))
            done
            [ -n "$ok" ] || { echo "upload failed: $base"; exit 1; }
          done
          echo "all artifacts uploaded"
        if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/v') }}
