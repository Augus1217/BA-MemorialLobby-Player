<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BA Memorial Lobby</title>
  <style>
    /* Game talk-font assets (extracted from BA bundles): M PLUS 1p (JP),
       Noto Sans TC (TW/簡), Noto Sans (EN). Rendered offline via @font-face. */
    @font-face {
      font-family: 'BA MPlus1p';
      src: url('assets/fonts/BA-MPLUS1p-Medium.ttf') format('truetype');
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: 'BA NotoSansTC';
      src: url('assets/fonts/BA-NotoSansTC-Medium.otf') format('opentype');
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: 'BA NotoSans';
      src: url('assets/fonts/BA-NotoSans-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal;
    }
    /* BA PC mouse cursor (PCIcon_MousePoint extracted from game bundles), hotspot at arrow tip */
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #05060d; font-family: "Segoe UI", system-ui, sans-serif;
      cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), auto;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { touch-action: none; cursor: inherit; }

    /* cinematic vignette + soft top shading (non-interactive) */
    #fx {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 46%, transparent 55%, rgba(2,3,10,.55) 100%),
        linear-gradient(rgba(0,0,0,.28), transparent 18%, transparent 82%, rgba(0,0,0,.32));
    }

    /* memorial intro white-flash overlay — rebuilt 1:1 from the game Timeline
       (Recorded clip: Volume.weight -> ColorAdjustments postExposure 5.5 +
       pure-white sprite alpha). opacity is driven per-frame by renderer/app.js;
       sits above the camera vignette but below the dialog/HUD (NGUI UI in-game
       renders above the post-processing). */
    #whiteflash {
      position: fixed; inset: 0; z-index: 6; background: #fff;
      opacity: 0; pointer-events: none; will-change: opacity;
    }

    /* fade overlay for load / lobby switch */
    #fade {
      position: fixed; inset: 0; z-index: 30; background: #05060d;
      opacity: 0; pointer-events: none; transition: opacity .7s ease;
    }
    #fade.on { opacity: 1; pointer-events: auto; }

    #loading {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center; color: #cfd6ff;
      font-size: 13px; letter-spacing: .2em; background: rgba(5,6,13,.72);
    }
    #loading.show { display: flex; }
    #loading .spin {
      width: 22px; height: 22px; margin-right: 14px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.15); border-top-color: #a9b6ff;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* minimal auto-hiding HUD */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .hudbar {
      position: absolute; left: 0; right: 0;
      display: flex; align-items: center;
      transition: opacity .6s ease, transform .6s ease;
    }
    #hudTop { top: 0; padding: 22px 26px; justify-content: space-between; }
    #hudBottom { bottom: 0; padding: 18px 26px; justify-content: center; }
    #hud.idle #hudTop { opacity: 0; transform: translateY(-12px); }
    #hud.idle #hudBottom { opacity: 0; transform: translateY(12px); }
    #hud.idle { pointer-events: none; }
    #hud.idle > * { pointer-events: none; }

    .btn {
      background: rgba(10,12,26,.42); color: #e8ecff; border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%; width: 40px; height: 40px; font-size: 17px; line-height: 1;
      cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer; display: flex; align-items: center; justify-content: center;
      transition: background .25s, border-color .25s, opacity .25s;
      backdrop-filter: blur(6px);
    }
    .btn:hover { background: rgba(40,48,96,.6); border-color: rgba(255,255,255,.35); }
    .btn.off { opacity: .4; }
    #titleBlock { text-align: center; pointer-events: none !important; }
    #charName {
      color: #f2f4ff; font-size: 20px; letter-spacing: .18em; font-weight: 600;
      text-shadow: 0 2px 14px rgba(0,0,0,.8);
    }
    #subName {
      color: rgba(210,220,255,.66); font-size: 11px; letter-spacing: .34em; margin-top: 4px;
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
    }

    #err { position: fixed; bottom: 14px; left: 14px; right: 14px; z-index: 50;
      background: rgba(150,30,30,.9); color: #fff; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; white-space: pre-wrap; display: none; }

    /* left student sidebar (collapsible) */
    #btnStudents {
      position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
      z-index: 18; border-radius: 10px; width: 38px; height: 38px;
    }
    #sidePanel {
      position: fixed; left: 0; top: 0; bottom: 0; width: 320px; z-index: 20;
      background: rgba(8,10,22,.92); border-right: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px); display: flex; flex-direction: column;
      transform: translateX(-100%); transition: transform .3s ease;
    }
    #sidePanel.open { transform: translateX(0); }
    #sidePanel .sb-head {
      display: flex; gap: 8px; align-items: center; padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    #sbSearch {
      flex: 1; background: rgba(255,255,255,.06); color: #e8ecff;
      border: 1px solid rgba(255,255,255,.14); border-radius: 6px;
      padding: 8px 10px; font-size: 13px; outline: none; min-width: 0;
    }
    #sbSearch:focus { border-color: rgba(169,182,255,.6); }
    #sbSearch::placeholder { color: rgba(210,220,255,.45); }
    #sbClose { width: 34px; height: 34px; border-radius: 6px; flex: none; }
    #sbList { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
    #sbList::-webkit-scrollbar { width: 8px; }
    #sbList::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
    .sb-group-head {
      color: #9aa4e0; font-size: 12px; letter-spacing: .08em; font-weight: 600;
      padding: 12px 4px 4px; display: flex; align-items: baseline; gap: 8px;
    }
    .sb-group-head:first-child { padding-top: 6px; }
    .sb-group-head .cnt { color: rgba(200,210,255,.4); font-size: 11px; font-weight: 400; }
    .sb-item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent;
      border: none; color: #dfe4ff; font-size: 13px; padding: 6px 10px;
      border-radius: 6px; cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer;
    }
    .sb-ico { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; background: rgba(20,25,60,.6); }
    .sb-item:hover { background: rgba(60,70,140,.35); }
    .sb-item.cur { background: rgba(80,95,180,.45); color: #fff; }
    .sb-empty { color: rgba(210,220,255,.5); font-size: 13px; padding: 22px 8px; text-align: center; }

    /* export panel (video export) */
    #exportPanel, #settingsPanel {
      position: fixed; z-index: 60; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 360px; background:
        linear-gradient(165deg, rgba(28,42,88,.97) 0%, rgba(12,16,38,.98) 55%, rgba(8,10,26,.98) 100%);
      border: 1px solid rgba(120,160,255,.32);
      border-radius: 14px; padding: 18px 20px; box-shadow:
        0 24px 70px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(160,190,255,.18),
        0 0 0 1px rgba(76,167,255,.08);
      display: none; color: #e8ecff; backdrop-filter: blur(12px);
    }
    #exportPanel.open, #settingsPanel.open { display: block; animation: panelIn .22s ease-out; }
    @keyframes panelIn {
      from { opacity: 0; transform: translate(-50%, -48%) scale(.96); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .panel-title {
      font-size: 15px; font-weight: 600; letter-spacing: .14em; margin-bottom: 15px;
      display: flex; align-items: center; gap: 10px; color: #dbe6ff;
    }
    .panel-title::before, .panel-title::after {
      content: ''; height: 2px; flex: none;
      background: linear-gradient(90deg, transparent, rgba(108,166,255,.85));
      border-radius: 1px;
    }
    .panel-title::before { width: 22px; }
    .panel-title::after { flex: 1; opacity: .45; }
    #expChar { font-size: 12px; color: #9aa4e0; letter-spacing: .04em; margin-left: auto; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; margin: 11px 0; }
    .panel-row .lbl { font-size: 12px; color: #9aa4e0; letter-spacing: .08em; }
    .segs { display: flex; gap: 4px; }
    .segs button {
      background: rgba(255,255,255,.07); color: #cfd6ff; border: 1px solid rgba(255,255,255,.12);
      border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer; transition: background .2s;
    }
    .segs button:hover { background: rgba(255,255,255,.13); }
    .segs button.on {
      background: linear-gradient(135deg, rgba(96,150,255,.5), rgba(76,120,240,.42));
      border-color: rgba(140,180,255,.8); color: #fff;
      box-shadow: 0 0 10px rgba(96,150,255,.3), inset 0 1px 0 rgba(200,220,255,.25);
    }
    .segs button.dis { opacity: .35; pointer-events: none; }
    #expTalkSel {
      background: rgba(255,255,255,.07); color: #e8ecff; border: 1px solid rgba(255,255,255,.14);
      border-radius: 6px; padding: 5px 10px; font-size: 12px; max-width: 220px;
      cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer;
    }
    #expTalkSel:disabled { opacity: .35; }
    #expCustomRow input {
      width: 84px; background: rgba(255,255,255,.07); color: #e8ecff;
      border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 5px 8px; font-size: 12px;
    }
    #expCustomRow input::-webkit-outer-spin-button, #expCustomRow input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .ck { font-size: 12px; color: #cfd6ff; display: flex; align-items: center; gap: 6px; cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer; }
    .ck input { accent-color: #4c8dff; }
    .ck.dis { opacity: .35; pointer-events: none; }
    .panel-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .btnTxt {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #e8ecff;
      border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer; transition: background .2s;
    }
    .btnTxt:hover { background: rgba(255,255,255,.15); border-color: rgba(169,182,255,.45); }
    .btnTxt.primary {
      background: linear-gradient(135deg, rgba(96,150,255,.55), rgba(76,120,240,.5));
      border-color: rgba(140,180,255,.75);
      box-shadow: 0 2px 12px rgba(76,140,255,.25);
    }
    .btnTxt.primary:hover { background: linear-gradient(135deg, rgba(116,168,255,.7), rgba(90,136,250,.62)); }

    /* settings panel */
    #settingsPanel { width: 400px; max-height: 82vh; overflow-y: auto; }
    #settingsPanel::-webkit-scrollbar { width: 8px; }
    #settingsPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
    .set-section { border-top: 1px solid rgba(130,160,255,.14); padding-top: 12px; margin-top: 14px; }
    .set-section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
    .set-head {
      font-size: 12px; color: #8fb4ff; letter-spacing: .16em; font-weight: 600; margin-bottom: 9px;
      display: flex; align-items: center; gap: 7px;
    }
    .set-head::before {
      content: ''; width: 3px; height: 11px; border-radius: 2px;
      background: linear-gradient(180deg, #6ca6ff, #4c7cff);
      box-shadow: 0 0 6px rgba(108,166,255,.6);
    }
    #setLangSegs button { min-width: 52px; }
    #setStreamingRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #setStreamingDesc { font-size: 11px; color: rgba(200,210,255,.55); line-height: 1.5; margin-top: 6px; }
    #setAssetsStatus { font-size: 12px; color: #cfd6ff; line-height: 1.7; }
    #setAssetsStatus .ok { color: #8fd49c; }
    #setAssetsStatus .warn { color: #e8c268; }
    #setDownloadBtn { width: 100%; margin-top: 10px; }

    /* REC badge */
    #recBadge {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 70;
      display: none; align-items: center; gap: 9px; background: rgba(120,20,25,.88); color: #fff;
      border-radius: 20px; padding: 7px 14px; font-size: 13px; letter-spacing: .12em;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    #recBadge.show { display: flex; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5252; animation: recblink 1s infinite; }
    @keyframes recblink { 50% { opacity: .2; } }
    .rec-sep { color: rgba(255,255,255,.5); }
    #recBadge button {
      background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 6px;
      width: 24px; height: 24px; cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer; font-size: 12px; line-height: 1;
    }
    #recBadge button:hover { background: rgba(255,255,255,.3); }

    /* toast */
    #toast {
      position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); z-index: 60;
      background: rgba(18,72,38,.94); color: #eafff0; padding: 10px 18px; border-radius: 8px;
      font-size: 13px; letter-spacing: .06em; opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #toast.show { opacity: 1; }
    #err.ok { background: rgba(18,72,38,.94); }

    /* speaking chat dialog — real BA memorial-lobby balloon sprite
       (assets/ui/Lobby_balloon.png, NGUI atlas borders L80 R50 T84 B60,
       sprite 136x146). The balloon auto-sizes to the label like the game's
       anchor chain (L79 R59 T45 B44 around the text); the 9-slice borders stay
       at their native sprite size (84/50/60/80 × --bs) and only the middle
       stretches, exactly like an NGUI sliced sprite.
       Label per ChatDialog prefab: fontSize 52, color #3E444A, LEFT-aligned
       (mAlignment=1 = NGUIText.Alignment.Left), letter-spacing -2,
       line spacing +10, ResizeFreely wrapping at 740.
       Round-3: the prefab sizes are in the lobby UI design space, and the
       in-game balloon renders at half that (verified: app balloon was ~2x the
       real one), so --bs is vw/3840 (NOT vw/1920) for the balloon only. */
    #chatDialog {
      position: fixed; z-index: 9;
      --bs: calc(100vw / 3840);
      /* Talk font follows the game's per-language runtime swap (UseLocalizeFont):
         tw/zh -> Noto Sans TC, ja/jp -> M PLUS 1p, en -> Noto Sans; unknown
         text defaults to the TC stack (the app's TW-first subtitle behaviour). */
      --chatFont: 'BA NotoSansTC', 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      width: fit-content; height: fit-content;
      /* Round-4: the box is bottom-pinned at the Talk origin, so a short
         one-line line shrinks the box upward and the top (and tail) sink.
         MIN height floors the box at the full 2-line reference height
         (213 = padding 45+44 + 2 * lineHeight 62) so the top never drops;
         the text then centres vertically in the box. border-box keeps the
         floor as the WHOLE border-box height (padding included). */
      min-height: calc(213 * var(--bs));
      box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center;
      padding: calc(45 * var(--bs)) calc(59 * var(--bs)) calc(44 * var(--bs)) calc(79 * var(--bs));
      opacity: 0; pointer-events: none;
      transition: opacity .4s ease;
    }
    #chatDialog.show { opacity: 1; }
    #chatDialog[data-lang="ja"], #chatDialog[data-lang="jp"] { --chatFont: 'BA MPlus1p', 'M PLUS 1p', 'Noto Sans JP', 'Noto Sans TC', sans-serif; }
    #chatDialog[data-lang="en"] { --chatFont: 'BA NotoSans', 'Noto Sans', 'Segoe UI', sans-serif; }
    /* Balloon sprite + label margins follow the line's DialogType (set on
       #chatDialog[data-dtype] by renderer/app.js). Think lines (OS bubble) use
       Lobby_balloon2 (186x146, NGUI borders L130 R50 T85 B55), Talk uses
       Lobby_balloon (136x146, L80 R50 T84 B60); UITalk would be the title-only
       Common_Balloon_Type2. The label padding is the NGUI label margin around
       the text; min-height floors the box at 2 label lines + vertical padding. */
    #chatDialog[data-dtype="Think"] {
      padding: calc(43 * var(--bs)) calc(50 * var(--bs)) calc(55 * var(--bs)) calc(130 * var(--bs));
      min-height: calc(222 * var(--bs));
    }
    #chatBubble {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      border-style: solid; border-color: transparent; border-width: 0;
      border-image: url('assets/ui/Lobby_balloon.png') 84 50 60 80 fill stretch;
      border-image-width: calc(84 * var(--bs)) calc(50 * var(--bs)) calc(60 * var(--bs)) calc(80 * var(--bs));
      z-index: 0;
    }
    #chatDialog[data-dtype="Think"] #chatBubble {
      border-image: url('assets/ui/Lobby_balloon2.png') 85 50 55 130 fill stretch;
      border-image-width: calc(85 * var(--bs)) calc(50 * var(--bs)) calc(55 * var(--bs)) calc(130 * var(--bs));
    }
    #chatName { display: none; }
    #chatText {
      position: relative; z-index: 1;
      font-size: calc(52 * var(--bs));
      line-height: calc(62 * var(--bs));            /* fontSize 52 + spacingY 10 */
      letter-spacing: calc(-2 * var(--bs));
      color: #3E444A;
      font-family: var(--chatFont);
      text-align: left; white-space: pre-wrap; word-break: break-word;
      max-width: calc(740 * var(--bs));
    }
    #chatText:empty { display: none; }

    /* recording: keep the window as clean as the captured canvas */
    body.recording #hud, body.recording #fx, body.recording #btnStudents,
    body.recording #sidePanel, body.recording #exportPanel, body.recording #settingsPanel, body.recording #chatDialog { display: none !important; }

    /* Loading screen: intro + spinner + 確認中です…… */
    #loadingScreen {
      position: fixed; inset: 0; z-index: 200;
      background: #05060d;
      overflow: hidden;
    }
    #loadingScreen.hidden { display: none; }
    #loadingScreen.fade-out {
      animation: loadingFadeOut 0.8s ease-out forwards;
    }
    @keyframes loadingFadeOut {
      to { opacity: 0; pointer-events: none; }
    }
    #tapToStart {
      position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
      color: #fff; font-size: 18px; letter-spacing: .35em; text-transform: uppercase;
      cursor: var(--cur-img) var(--cur-hx) var(--cur-hy), pointer; z-index: 210;
      animation: pulse 2.2s ease-in-out infinite;
      user-select: none; -webkit-user-select: none;
      text-shadow: 0 0 12px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.9);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }
    #loadingIndicator {
      position: absolute; bottom: 1.76vh; left: 2.24vw;
      display: flex; align-items: center; gap: 14px;
      z-index: 10;
    }
    @font-face {
      font-family: 'BA Font';
      src: url('assets/loading/font.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    #loadingText,
    #bootLoadingText {
      font-size: 2.5vh; color: #000;
      letter-spacing: .06em; font-family: 'BA Font', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif;
      font-weight: normal;
      text-shadow: 
        -1px -1px 0 rgba(255,255,255,0.9),
        1px -1px 0 rgba(255,255,255,0.9),
        -1px 1px 0 rgba(255,255,255,0.9),
        1px 1px 0 rgba(255,255,255,0.9);
    }
    #downloadPanel {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 420px; max-width: 90vw; text-align: center; color: #e8ecff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: rgba(5,6,13,.85); padding: 32px; border-radius: 12px;
    }
    #assetTitle {
      font-size: 28px; font-weight: 700; letter-spacing: .12em;
      margin-bottom: 6px; color: #fff;
    }
    #assetSubtitle {
      font-size: 13px; color: rgba(210,220,255,.6); letter-spacing: .08em;
      margin-bottom: 28px;
    }
    #assetStatus {
      font-size: 13px; color: #9aa4e0; letter-spacing: .06em;
      margin-bottom: 14px; min-height: 20px;
    }
    #assetProgress { margin-bottom: 10px; }
    #assetProgressBar {
      width: 100%; height: 6px; background: rgba(255,255,255,.1);
      border-radius: 3px; overflow: hidden;
    }
    #assetProgressFill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #6a7aff, #a0b4ff);
      border-radius: 3px; transition: width .3s ease;
    }
    #assetProgressText {
      font-size: 12px; color: rgba(210,220,255,.5); margin-top: 6px;
    }
    #assetDetail {
      font-size: 12px; color: rgba(210,220,255,.4); margin-bottom: 20px;
      min-height: 18px;
    }

    /* BA PC cursor, scaled to the window via the same vw/3840 design scale used
       for the chat balloon. CSS cursors can't scale a url(), so this inline
       script regenerates the image into a data-URL and sets these vars. */
    :root {
      --cur-img: url('assets/ui/PCIcon_MousePoint.png');
      --cur-hx: 2; --cur-hy: 2;
    }
    html.ba-cursor-off, html.ba-cursor-off * { cursor: auto !important; }
  </style>
  <script>
    // Scale the BA cursor image with the window (3840-wide design reference).
    function updateCursor() {
      let cursorOn = true;
      try { cursorOn = localStorage.getItem('ba_cursor') !== '0'; } catch {}
      document.documentElement.classList.toggle('ba-cursor-off', !cursorOn);
      if (!cursorOn) return;
      const img = updateCursor._img;
      if (!img || !img.complete) return;
      const scale = Math.max(0.45, window.innerWidth / 3840);
      const size = Math.max(16, Math.round(64 * scale));
      const c = updateCursor._canvas || (updateCursor._canvas = document.createElement('canvas'));
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, size, size);
      const st = document.documentElement.style;
      st.setProperty('--cur-img', `url("${c.toDataURL('image/png')}")`);
      const hs = Math.max(1, Math.round(2 * size / 64));   // hotspot scales with the image
      st.setProperty('--cur-hx', String(hs));
      st.setProperty('--cur-hy', String(hs));
    }
    updateCursor._img = new Image();
    updateCursor._img.onload = updateCursor;
    updateCursor._img.src = 'assets/ui/PCIcon_MousePoint.png';
    window.addEventListener('resize', updateCursor);
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="fx"></div>
  <div id="hud">
    <div id="hudTop" class="hudbar">
      <button id="btnPrev" class="btn" data-i18n-title="hud.prev" title="上一位">‹</button>
      <div id="titleBlock">
        <div id="charName"></div>
        <div id="subName">MEMORIAL LOBBY</div>
      </div>
      <button id="btnNext" class="btn" data-i18n-title="hud.next" title="下一位">›</button>
    </div>
    <div id="hudBottom" class="hudbar">
      <button id="btnSkip" class="btn" style="margin-right:20px" data-i18n-title="hud.skip" title="ˑˑˑˑ (跳過)">ˑˑˑˑ</button>
      <button id="btnLang" class="btn" data-i18n-title="hud.lang" title="名稱語言 (繁/日/簡/EN)">繁</button>
      <button id="btnFull" class="btn" style="margin-left:10px" data-i18n-title="hud.fullscreen" title="全螢幕">⤢</button>
      <button id="btnBgm" class="btn" style="margin-left:10px" data-i18n-title="hud.bgm" title="音樂">♪</button>
      <button id="btnExport" class="btn" style="margin-left:10px" data-i18n-title="hud.export" title="匯出影片">⏺</button>
      <button id="btnSettings" class="btn" style="margin-left:10px" data-i18n-title="hud.settings" title="設定">⚙</button>
    </div>
  </div>

  <button id="btnStudents" class="btn" data-i18n-title="hud.students" title="學生列表">☰</button>
  <div id="sidePanel">
    <div class="sb-head">
      <input id="sbSearch" type="text" data-i18n-ph="sidebar.searchPh" placeholder="搜尋學生 / 名稱 / ID…" />
      <button id="sbClose" class="btn" data-i18n-title="sidebar.close" title="收合">×</button>
    </div>
    <div id="sbList"></div>
  </div>

  <div id="loading"><div class="spin"></div><span id="loadingText" data-i18n="loading.loading">載入中</span></div>
  <div id="whiteflash"></div>
  <div id="fade"></div>
  <div id="err"></div>
  <div id="toast"></div>

  <div id="chatDialog">
    <div id="chatBubble"></div>
    <div id="chatName"></div>
    <div id="chatText"></div>
  </div>

  <div id="exportPanel">
    <div class="panel-title" data-i18n="exp.title">匯出動畫 <span id="expChar"></span></div>
    <div class="panel-row"><span class="lbl" data-i18n="exp.anim">動畫</span>
      <div class="segs" id="expClip">
        <button data-k="start">Start_Idle</button><button data-k="idle" class="on">Idle</button><button data-k="talk">Talk</button>
      </div>
    </div>
    <div class="panel-row" id="expTalkRow" style="display:none">
      <span class="lbl" data-i18n="exp.talkClip">Talk clip</span>
      <select id="expTalkSel"></select>
    </div>
    <div class="panel-row"><span class="lbl" data-i18n="exp.res">解析度</span>
      <div class="segs" id="expRes">
        <button data-r="win" class="on" data-i18n="exp.resWin">目前視窗</button><button data-r="screen" data-i18n="exp.resScreen">目前螢幕</button><button data-r="kivo" data-i18n="exp.resKivo">kivo 適應</button><button data-r="custom" data-i18n="exp.resCustom">自訂</button>
      </div>
    </div>
    <div class="panel-row" id="expCustomRow" style="display:none">
      <span class="lbl" data-i18n="exp.custom">自訂</span>
      <input type="number" id="expCustomW" min="64" max="7680" value="1920" />
      <span class="lbl">×</span>
      <input type="number" id="expCustomH" min="64" max="4320" value="1080" />
    </div>
    <div class="panel-row"><span class="lbl" data-i18n="exp.fps">幀率</span>
      <div class="segs" id="expFps">
        <button data-v="30" class="on">30</button><button data-v="60">60</button>
      </div>
    </div>
    <div class="panel-row"><span class="lbl" data-i18n="exp.fmt">格式</span>
      <div class="segs" id="expFmt">
        <button data-fmt="mp4" class="on">MP4</button><button data-fmt="webm">WebM</button>
      </div>
    </div>
    <div class="panel-row" id="expVoiceRow">
      <label class="ck"><input type="checkbox" id="expVoice" checked /> <span data-i18n="exp.voice">包含語音</span></label>
      <label class="ck" id="expDialogCk"><input type="checkbox" id="expDialog" /> <span data-i18n="exp.dialog">包含對話框</span></label>
    </div>
    <div class="panel-btns">
      <button id="expBgm" class="btnTxt" data-i18n="exp.bgm">匯出 BGM</button>
      <button id="expCancel" class="btnTxt" data-i18n="exp.cancel">取消</button>
      <button id="expStart" class="btnTxt primary" data-i18n="exp.start">開始匯出</button>
    </div>
  </div>

  <!-- Settings panel: language / download mode / assets -->
  <div id="settingsPanel">
    <div class="panel-title" data-i18n="set.title">設定</div>

    <div class="set-section">
      <div class="set-head" data-i18n="set.lang">語言</div>
      <div class="panel-row">
        <span class="lbl" data-i18n="set.uiLang">介面與名稱語言</span>
        <div class="segs" id="setLangSegs"></div>
      </div>
    </div>

    <div class="set-section">
      <div class="set-head" data-i18n="set.download">資源下載</div>
      <div id="setStreamingRow">
        <span class="lbl" data-i18n="set.mode">下載模式</span>
        <div class="segs" id="setModeSegs">
          <button data-m="full" data-i18n="set.modeFull">完整安裝</button>
          <button data-m="streaming" data-i18n="set.modeStreaming">串流模式</button>
        </div>
      </div>
      <div id="setStreamingDesc" data-i18n="set.modeStreamingDesc">串流模式：初始只下載核心資源，進入大廳時才下載該角色的資料。可離線播放已下載過的大廳。</div>
    </div>

    <div class="set-section">
      <div class="set-head" data-i18n="set.effects">視覺效果</div>
      <label class="ck" style="margin:6px 0;"><input type="checkbox" id="setCursorCk"> <span data-i18n="set.cursor">BA 遊標</span></label>
      <label class="ck" style="margin:6px 0;"><input type="checkbox" id="setClickFxCk"> <span data-i18n="set.clickfx">點擊特效 (Click FX)</span></label>
    </div>

    <div class="set-section">
      <div class="set-head" data-i18n="set.assets">資源狀態</div>
      <div id="setAssetsStatus"></div>
      <button id="setDownloadBtn" class="btnTxt primary" style="display:none" data-i18n="dl.start">開始下載</button>
      <div id="setAssetsProgress" style="display:none; margin-top:10px;">
        <div style="background:rgba(255,255,255,.08); border-radius:6px; height:14px; overflow:hidden;">
          <div id="setProgressFill" style="height:100%; width:0%; background:rgba(120,140,255,.55); transition:width .3s;"></div>
        </div>
        <div id="setProgressText" style="font-size:11px; color:#9aa4e0; margin-top:5px;">0%</div>
      </div>
    </div>

    <div class="panel-btns">
      <button id="setClose" class="btnTxt primary" data-i18n="set.close">關閉</button>
    </div>
  </div>

  <div id="recBadge">
    <span class="rec-dot"></span> REC <span id="recTime">0:00</span>
    <span class="rec-sep">/</span> <span id="recDur">0:10</span>
    <button id="recStop" data-i18n-title="rec.stop" title="停止錄製">■</button>
  </div>

  <!-- Asset download overlay -->
  <!-- Loading screen: intro video + spinner + 確認中です…… -->
  <div id="loadingScreen">
    <video id="loadingVideo" autoplay muted loop playsinline
      style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;">
      <source src="assets/loading/title.webm" type="video/webm">
    </video>
    <div id="loadingIndicator">
      <img id="loadingSpinner" src="assets/loading/spinner.png"
        style="width:5.55vh;height:5.55vh;animation:spin 3s linear infinite;image-rendering:auto;filter:none;">
      <span id="bootLoadingText" data-i18n="boot.checking">檢查更新中……</span>
    </div>
    <!-- 檢查完成後顯示，點擊進入 lobby -->
    <div id="tapToStart" style="display:none">TAP TO START</div>
    <!-- 需要下載時顯示的面板 -->
    <div id="downloadPanel" style="display:none">
      <div id="assetTitle">BA Memorial Lobby</div>
      <div id="assetSubtitle" data-i18n="dl.subtitle">發現新版本，需下載遊戲資源</div>
      <div id="assetStatus"></div>
      <div id="assetProgress">
        <div id="assetProgressBar"><div id="assetProgressFill"></div></div>
        <div id="assetProgressText">0%</div>
      </div>
      <div id="assetDetail"></div>
      <label class="ck" id="streamingRow" style="margin:12px 0; justify-content:center; display:none;"><input type="checkbox" id="streamingCk"> <span data-i18n="dl.streamingOpt">串流模式（隨播隨下，初始只下載核心約 30MB）</span></label>
      <button id="assetBtn" class="btnTxt primary" style="display:none" data-i18n="dl.start">開始下載</button>
    </div>
  </div>

  <script>
    // 臨時錯誤鉤子：印完整 stack 方便除錯
    window.addEventListener('error', (e) => {
      console.log('[errhook]', e.error && e.error.stack ? e.error.stack : (e.message + ' @' + e.filename + ':' + e.lineno));
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.log('[errhook-reject]', e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
    });
  </script>
  <script type="module" src="/renderer/ba-web.js"></script>
  <script type="module" src="/renderer/app.js"></script>
</body>
</html>
